<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>I love you Okashah &lt;3</title>

  <!-- Google Fonts import -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #1a1829;
      font-family: 'VT323', monospace;
      font-size: 1.3rem;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100vw;
      height: 100vh;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    .room-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .image-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: calc(100vh * (16 / 9));
      max-height: calc(100vw * (9 / 16));
      aspect-ratio: 16 / 9;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .room-bg {
      width: 100%;
      height: 100%;
      object-fit: fill;
      display: block;
    }

    .hint-banner {
      position: absolute;
      top: 0;
      width: 100%;
      text-align: center;
      color: white;
      font-size: 6rem; 
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
      pointer-events: none;
      z-index: 10;
    }

    /* Pink Pixel Music Player Button */
    .music-btn {
      position: absolute;
      top: 15px;
      right: 15px;
      z-index: 20;
      background: #efb3b5;
      color: #5a2a3a;
      border: 3px solid #e37e99;
      padding: 6px 14px;
      font-family: 'VT323', monospace;
      font-size: 1.5rem;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 0 #ef92ad;
      transition: all 0.1s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .music-btn:hover {
      background: #efb3b5;
      transform: translateY(-2px);
      box-shadow: 0 6px 0 #c26780;
    }

    .music-btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #e57b98;
    }

    /* Invisible Clickable Hotspots */
    .hotspot {
      position: absolute;
      background: rgba(255, 255, 255, 0.0);
      border: 2px dashed rgba(255, 182, 193, 0.6);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .hotspot:hover {
      background: rgba(255, 192, 203, 0.3);
      box-shadow: 0 0 15px rgba(255, 182, 193, 0.8);
      transform: scale(1.03);
    }

    /* Hotspot positions */
    #spot-poster { top: 21%; left: 2%; width: 11%; height: 26%; }
    #spot-letter { top: 42%; left: 39.5%; width: 13%; height: 13.5%; }
    #spot-book   { top: 72%; left: 6%;  width: 11%; height: 20%; }
    #spot-photo  { top: 75%; left: 85%; width: 8%;  height: 15%; }

    /* Pop-up Overlay (Modal) */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 1000;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* Standard Popup Box Style */
    .modal-card {
      background: #fff8fb;
      border: 3px solid #e2a8be;
      padding: 30px;
      border-radius: 16px;
      max-width: 450px;
      width: 90%;
      text-align: center;
      color: #4a3e3d;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
      position: relative;
      transform: translateY(20px);
      transition: transform 0.3s ease;
      max-height: 85vh;
      overflow-y: auto;
    }

    /* Letter-Specific Stationary Style */
    .modal-card.letter-style {
      background: #fff5f8;
      border: 3px solid #f4a6bf;
      box-shadow: inset 0 0 0 8px #ffebf2, 0 15px 35px rgba(0,0,0,0.3);
      padding: 35px 25px 30px 25px;
      max-width: 520px;
      text-align: left;
    }

    .letter-paper {
      background: #ffffff;
      border: 2px dashed #f2b8cb;
      border-radius: 12px;
      padding: 25px;
      margin-top: 15px;
      box-shadow: 0 4px 12px rgba(244, 166, 191, 0.15);
      max-height: 380px;
      overflow-y: auto;
    }

    .letter-paper p {
      color: #5a4049;
      line-height: 1.8;
      font-size: 1.5rem;
      margin-bottom: 15px;
      white-space: pre-line;
    }

    .letter-header {
      text-align: center;
      color: #d6688d;
      font-size: 1.8rem;
      margin-bottom: 5px;
    }

    .heart-icon {
      display: block;
      text-align: center;
      font-size: 2.2rem;
      margin-bottom: 5px;
    }

    .modal-overlay.active .modal-card {
      transform: translateY(0);
    }

    .modal-card img {
      max-width: 100%;
      border-radius: 10px;
      margin-bottom: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }

    .modal-card h2 {
      margin-bottom: 12px;
      color: #b25d7e;
      font-size: 1.8rem;
    }

    .modal-card p {
      line-height: 1.6;
      font-size: 1.5rem;
    }

    .reasons-list {
      font-size: 1.5rem;
      text-align: left;
      padding-left: 20px;
      line-height: 1.6;
      margin-bottom: 15px;
    }

    .close-btn {
      position: absolute;
      top: 10px;
      right: 15px;
      background: none;
      border: none;
      font-size: 1.8rem;
      cursor: pointer;
      color: #b25d7e;
    }
  </style>
</head>
<body>

  <!-- Audio Element -->
  <audio id="bgm" loop src="bgm.mp3"></audio>

  <div class="room-container">
    <div class="image-wrapper">
      <div class="hint-banner">Happy Boyfriend's Day, Okashah!</div>

      <!-- Pink Pixel Music Button -->
      <button class="music-btn" id="musicBtn" onclick="toggleMusic()">♫ Play Music</button>

      <img src="room.jpg" alt="Cozy Pixel Room" class="room-bg">

      <!-- Clickable Items (Hotspots) -->
      <div class="hotspot" id="spot-poster" onclick="openModal('poster')"></div>
      <div class="hotspot" id="spot-letter" onclick="openModal('letter')"></div>
      <div class="hotspot" id="spot-book"   onclick="openModal('book')"></div>
      <div class="hotspot" id="spot-photo"  onclick="openModal('photo')"></div>
    </div>
  </div>

  <!-- Popup Window -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-card" id="modalCard">
      <button class="close-btn" onclick="closeModal()">&times;</button>
      <div id="modalContent"></div>
    </div>
  </div>

  <script>
    const audio = document.getElementById('bgm');
    const musicBtn = document.getElementById('musicBtn');
    let isPlaying = false;

    function toggleMusic() {
      if (isPlaying) {
        audio.pause();
        musicBtn.innerHTML = '♫ Play Music';
      } else {
        audio.play();
        musicBtn.innerHTML = '❚❚ Pause Music';
      }
      isPlaying = !isPlaying;
    }

    const contents = {
      letter: `
        <span class="heart-icon">💌</span>
        <h2 class="letter-header">For You</h2>
        <div class="letter-paper">
          <p>My Baby,</p>
          <p>Happy Boyfriend's Day! I wanted to make something special for you to show how much you mean to me.</p>
          <p>I don't think I'll ever be able to fully explain my love for you, but I want to try. There are so many things I wish I could say to you, in the moments between our calls, or when I wish I could reach through the screen and hold your hand or hug you tight. So, for now, I'm putting some of those feelings into words, hoping that you feel even a little bit of the love I have for you. </p>
          <p>If I could give you one thing to carry with you everywhere, it would be the certainty that you are loved. Not just on the days when everything feels easy, and not just when we're talking for hours, but on the quiet days, the difficult days, and the days when you need a little extra warmth. I hope you know how much you have changed my days, even in ways you probably don't realize.</p>
          <p>You have this way of making ordinary moments feel special, and somehow, even with all the distance between us, you have become the closest person to my heart. One of my favorite things about us is how safe and understood you make me feel. I never want you to think that you have to be perfect around me or that you have to have everything figured out. You can have good days, bad days, and days when you don't really know what you're feeling. None of those things make you any less deserving of love. I hope you always feel like you can be yourself with me, because the person you are is who I care about so deeply.</p>
          <p>I love the little things about you, too. The way you make me laugh, the way you goof off, and the way you can make me smile just by being you. I love our random moments, our jokes, our calls, and even the simple parts of our days that we get to share. Those are the things that remind me how lucky I am to have you in my life. Not just as my boyfriend but as my best friend too.</p>
          <p>I know the distance isn't always easy, and I wish more than anything that I could be there beside you. I wish I could give you hugs, sit next to you, and spend time together without having to say goodbye at the end of a call. But even though I can't do all of those things right now, I hope you never doubt that my love and care for you are real. You matter to me in ways that distance can't change. I'm so glad I have you, even though you live across the world.</p>
          <p>You're so kind, caring, goofy, dumb, adorable, loving, unhinged, handsome, and perfect for me in every way. I love how you match my energy, support me during my rough days, and are always such an amazing bundle of joy. I'm so proud to be your girlfriend, and you're genuinely the most amazing boy. (Noor and the others absolutely missed out.) Thank you for being you, for letting me be part of your life, and for bringing back my smile.</p>
          <p>I love you so much, my darling, and I am so incredibly proud of you. I hope that whenever you come back to this, no matter how much time has passed or what kind of day you're having, you remember that there is someone in this world who loves you so, so much and will always be cheering you on.</p>
          <p>I love you to death, baby,<br>Zainab &lt;3</p>
        </div>
      `,
      poster: `
        <h2>12 Reasons Why I Love You</h2>
        <ul class="reasons-list">
          <li>I love the way you care</li>
          <li>I love the way you smile</li>
          <li>I love the way you listen</li>
          <li>I love your eyes</li>
          <li>I love your unc mustache</li>
          <li>I love how you love me</li>
          <li>I love you make me feel chosen</li>
          <li>I love your stupid jokes</li>
          <li>I love how you nerd out</li>
          <li>I love when you play guitar</li>
          <li>I love your voice</li>
          <li>I love how I can be myself with you</li>
        </ul>
        <p>And even more! 💕</p>
      `,
      book: `
        <h2>Zainab Cheeseee 🧀</h2>
        <p>Do you have a map? Because I keep getting lost in your eyes. (I love you so muchh)</p>
      `,
      photo: `
        <h2>Me and My Baby</h2>
        <img src="photo1.jpg" alt="Cute Memory Photo" />
        <p>I know we don't have any actual photos together but this always makes me smile.</p>
      `
    };

    function openModal(key) {
      const modalOverlay = document.getElementById('modalOverlay');
      const modalCard = document.getElementById('modalCard');
      const modalContent = document.getElementById('modalContent');
      
      if (key === 'letter') {
        modalCard.classList.add('letter-style');
      } else {
        modalCard.classList.remove('letter-style');
      }

      modalContent.innerHTML = contents[key];
      modalOverlay.classList.add('active');
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('active');
    }

    document.getElementById('modalOverlay').addEventListener('click', function(e) {
      if (e.target === this) {
        closeModal();
      }
    });
  </script>
</body>
</html>
