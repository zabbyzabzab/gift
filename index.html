<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bananaaaaa</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #1a1829;
      font-family: 'Georgia', serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* Container for the pixel art room background */
    .room-container {
      position: relative;
      width: 100%;
      max-width: 1000px;
      aspect-ratio: 16 / 9;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      border-radius: 12px;
      overflow: hidden;
    }

    .room-bg {
      width: 100%;
      height: 100%;
      object-fit: fill;
      display: block;
    }

    /* Invisible Clickable Hotspots */
    .hotspot {
      position: absolute;
      background: rgba(255, 255, 255, 0.0);
      border: 2px dashed rgba(255, 182, 193, 0.6);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .hotspot:hover {
      background: rgba(255, 192, 203, 0.3);
      box-shadow: 0 0 15px rgba(255, 182, 193, 0.8);
      transform: scale(1.03);
    }

    /* Hotspot positions */
    #spot-poster { top: 20%; left: 2%; width: 11%; height: 27%; }
    #spot-letter { top: 40%; left: 39%; width: 15%; height: 18%; }
    #spot-book   { top: 72%; left: 6%;  width: 11%; height: 21%; }
    #spot-photo  { top: 76%; left: 85%; width: 8%;  height: 17%; }

    /* Pop-up Overlay (Modal) */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 1000;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* Standard Popup Box Style */
    .modal-card {
      background: #fff8fb;
      border: 3px solid #e2a8be;
      padding: 30px;
      border-radius: 16px;
      max-width: 450px;
      width: 90%;
      text-align: center;
      color: #4a3e3d;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
      position: relative;
      transform: translateY(20px);
      transition: transform 0.3s ease;
      max-height: 85vh;
      overflow-y: auto;
    }

    /* Letter-Specific Stationary Style */
    .modal-card.letter-style {
      background: #fff5f8;
      border: 3px solid #f4a6bf;
      box-shadow: inset 0 0 0 8px #ffebf2, 0 15px 35px rgba(0,0,0,0.3);
      padding: 35px 25px 30px 25px;
      max-width: 520px;
      text-align: left;
    }

    .letter-paper {
      background: #ffffff;
      border: 2px dashed #f2b8cb;
      border-radius: 12px;
      padding: 25px;
      margin-top: 15px;
      box-shadow: 0 4px 12px rgba(244, 166, 191, 0.15);
      max-height: 380px;
      overflow-y: auto;
    }

    .letter-paper p {
      color: #5a4049;
      line-height: 1.8;
      font-size: 1.05rem;
      margin-bottom: 15px;
      white-space: pre-line;
    }

    .letter-header {
      text-align: center;
      color: #d6688d;
      font-size: 1.8rem;
      margin-bottom: 5px;
    }

    .heart-icon {
      display: block;
      text-align: center;
      font-size: 2.2rem;
      margin-bottom: 5px;
    }

    .modal-overlay.active .modal-card {
      transform: translateY(0);
    }

    .modal-card img {
      max-width: 100%;
      border-radius: 10px;
      margin-bottom: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }

    .modal-card h2 {
      margin-bottom: 12px;
      color: #b25d7e;
      font-size: 1.6rem;
    }

    .modal-card p {
      line-height: 1.6;
      font-size: 1.05rem;
    }

    .close-btn {
      position: absolute;
      top: 10px;
      right: 15px;
      background: none;
      border: none;
      font-size: 1.8rem;
      cursor: pointer;
      color: #b25d7e;
    }

    /* Top Banner Text */
    .hint-banner {
      position: absolute;
      top: 15px;
      width: 100%;
      text-align: center;
      color: white;
      font-size: 1.1rem;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div class="room-container">
    <div class="hint-banner">✨ Explore the room! Click on items to open hidden memories... ✨</div>
    
    <!-- Room Background -->
    <img src="room.jpg" alt="Cozy Pixel Room" class="room-bg">

    <!-- Clickable Items (Hotspots) -->
    <div class="hotspot" id="spot-poster" onclick="openModal('poster')"></div>
    <div class="hotspot" id="spot-letter" onclick="openModal('letter')"></div>
    <div class="hotspot" id="spot-book"   onclick="openModal('book')"></div>
    <div class="hotspot" id="spot-photo"  onclick="openModal('photo')"></div>
  </div>

  <!-- Popup Window -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-card" id="modalCard">
      <button class="close-btn" onclick="closeModal()">&times;</button>
      <div id="modalContent"></div>
    </div>
  </div>

  <script>
    const contents = {
      letter: `
        <span class="heart-icon">💌</span>
        <h2 class="letter-header">A Letter For You</h2>
        <div class="letter-paper">
          <p>Dearest [His Name],</p>

          <p>Happy National Boyfriend's Day! I wanted to make something sweet and special for you to show how much you mean to me.</p>

          <p>Thank you for always being my safe place, making me laugh when I need it most, and bringing so much happiness into my life every single day.</p>

          <p>I hope you love this little virtual space I built for you. You deserve all the love in the world today and every day!</p>

          <p>Forever & always,<br>[Your Name] ❤️</p>
        </div>
      `,
      poster: `
        <h2>Hang In There! 🐱</h2>
        <p>Whenever you're having a long or hard day, remember that I'm always cheering you on. You've got this!</p>
      `,
      book: `
        <h2>Our Chemistry 🧬</h2>
        <p>We might not be studying biology, but our chemistry is 100% real. Here's to making many more memories together!</p>
      `,
      photo: `
        <h2>My Favorite Memory 📸</h2>
        <img src="photo1.jpg" alt="Cute Memory Photo" />
        <p>Looking at this picture always makes me smile!</p>
      `
    };

    function openModal(key) {
      const modalOverlay = document.getElementById('modalOverlay');
      const modalCard = document.getElementById('modalCard');
      const modalContent = document.getElementById('modalContent');
      
      // Apply special stationary style if clicking the letter
      if (key === 'letter') {
        modalCard.classList.add('letter-style');
      } else {
        modalCard.classList.remove('letter-style');
      }

      modalContent.innerHTML = contents[key];
      modalOverlay.classList.add('active');
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('active');
    }

    document.getElementById('modalOverlay').addEventListener('click', function(e) {
      if (e.target === this) {
        closeModal();
      }
    });
  </script>
</body>
</html>
